# =============================================================================
# NeoDesk with Docker: the compose file to start from
# =============================================================================
# It runs the published image and builds nothing: one container, one process
# (signal, relay, API and the web console).
#
# Which compose file is which:
#   docker-compose.quick.single.yml          this file: the published image
#   docker-compose.quick.single.macvlan.yml  the published image on a macvlan
#                                            network, with its own LAN address
#   docker-compose.single.yml                builds the image from a checkout
#                                            of the repository (development)
#
# Install with the script. It saves this file as docker-compose.yml with a
# .env next to it in /opt/neodesk/docker, starts it and prints how to
# sign in:
#   curl -fsSL https://neode.sk/neodesk-docker.sh -o neodesk-docker.sh
#   sudo bash neodesk-docker.sh
#
# Or by hand:
#   curl -fsSL https://neode.sk/install/docker-compose.quick.single.yml -o docker-compose.yml
#   docker compose up -d
#   docker compose exec neodesk neodesk-show-admin-credentials
#
# Image: ghcr.io/neodeskapp/neodesk with the tag "latest", the newest
# release. Update to the newest release:
#   docker compose pull && docker compose up -d
# Pin a release instead: put NEODESK_IMAGE_TAG=<version> (for example
# 3.5.270) into .env next to this file. An image of 3.6.0-rc.4 or older keeps
# its data in /opt/rustdesk: pinned to one, also put
# NEODESK_DATA_PATH=/opt/rustdesk there (neodesk-docker.sh does it).
#
# Settings go into .env next to this file, one KEY=value per line; every
# key reaches the server (Docker Compose 2.24 or newer reads it):
#   RELAY_SERVERS=203.0.113.10     the address clients reach this server at
#                                  (found by itself at every start when empty)
#   NEODESK_CONSOLE_PORT=5080   the host port of the web console (3375; 5000 up to 3.6.0-rc.4)
#   NEODESK_CONSOLE_BIND=127.0.0.1  publish the console on this host
#                                  address only (behind a reverse proxy;
#                                  without it, on every IPv4 and IPv6 address)
#   ADMIN_PASSWORD=...             the admin's password, at the first start only
#   TRUST_PROXY=1                  the console is behind one reverse proxy
#
# HTTPS with Let's Encrypt (the profile "traefik"): a small Traefik in front
# of the console gets a certificate for a domain that points at this server
# and renews it by itself. neodesk-docker.sh --domain console.example.com
# sets it up; by hand, in .env next to this file:
#   COMPOSE_PROFILES=traefik       (traefik,postgres with PostgreSQL)
#   NEODESK_DOMAIN=console.example.com   the console's DNS name
#   LETSENCRYPT_EMAIL=you@yourdomain     optional: the contact of the Let's
#                                  Encrypt account
#   NEODESK_CONSOLE_BIND=127.0.0.1 the plain console port on this host only
#   TRUST_PROXY=1                  the client's address comes from Traefik
#   PANEL_PUBLIC_URL=https://console.example.com   the address in mails
# Optional: LETSENCRYPT_CA_SERVER (Let's Encrypt's staging server for
# tests), TRAEFIK_IMAGE_TAG (v3.3). Ports 80 (the certificate's HTTP
# challenge, then a redirect) and 443 must reach this server. After a
# change of NEODESK_DOMAIN, docker compose up -d makes the Traefik
# container again with the new name. Switching between the staging and the
# production server: neodesk-docker.sh moves the other server's acme.json
# aside; by hand, docker compose stop traefik, delete acme.json in the
# volume neodesk-traefik-letsencrypt, docker compose up -d.
#
# NEODESK_IPV6=true gives the containers' network IPv6 (Docker Engine 27 or
# newer), so the server sees IPv6 visitors' own addresses instead of the
# network's gateway, and Docker publishes the ports on IPv6 past ufw and
# firewalld, as on IPv4. neodesk-docker.sh turns it on for a new install on
# Engine 27 or newer (not with --no-ipv6); without the setting the network
# is IPv4 only. Older Docker Compose versions need docker compose down
# before it changes.
#
# Web console: http://<server>:3375
# RustDesk clients: ID server and relay <server>, API http://<server>:21121
# Logs: docker compose logs -f neodesk
# =============================================================================

services:
  neodesk:
    image: ghcr.io/neodeskapp/neodesk:${NEODESK_IMAGE_TAG:-latest}
    container_name: neodesk
    hostname: neodesk
    ports:
      # On every address of the host, IPv4 and IPv6; NEODESK_CONSOLE_BIND
      # names one (127.0.0.1 behind a reverse proxy, [::1] for IPv6)
      - "${NEODESK_CONSOLE_BIND:+${NEODESK_CONSOLE_BIND}:}${NEODESK_CONSOLE_PORT:-3375}:3375"  # Web console
      - "${NEODESK_CONSOLE_BIND:+${NEODESK_CONSOLE_BIND}:}${NEODESK_CONSOLE_HTTPS_PORT:-5443}:5443"  # Web console with HTTPS_ENABLED=true
      - "21114:21114"           # API for RustDesk clients without an API server setting
      - "21115:21115"           # NAT type test
      - "21116:21116/tcp"       # Signal TCP
      - "21116:21116/udp"       # Signal UDP
      - "21117:21117"           # Relay TCP
      - "21118:21118"           # WebSocket Signal
      - "21119:21119"           # WebSocket Relay
      - "21123:21123"           # Relay node control
      - "21121:21121"           # HTTP API (RustDesk client + REST)
      - "21122:21122"           # CDAP gateway (custom devices and agents)
    volumes:
      - neodesk-data:${NEODESK_DATA_PATH:-/opt/neodesk/data}
      - console-data:/app/data
    # Every KEY=value of .env next to this file reaches the server; the
    # entries under environment below win over it.
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      # Set TRUST_PROXY=1 when the panel is behind one reverse proxy.
      - TRUST_PROXY=${TRUST_PROXY:-}
      - CONSOLE_PORT=3375
      - HOST=0.0.0.0
      - API_HOST=0.0.0.0
      - API_ENABLED=false
      - ENCRYPTED_ONLY=1
      - SERVER_BACKEND=neodesk
      - HBBS_API_URL=http://127.0.0.1:21121/api
      - NEODESK_API_URL=http://127.0.0.1:21121/api
      - RUSTDESK_PATH=${NEODESK_DATA_PATH:-/opt/neodesk/data}
      - DATA_DIR=/app/data
      - NEODESK_CLIENT_REPO=${NEODESK_CLIENT_REPO:-neodeskapp/neodesk-client}
      - NEODESK_CLIENT_RELEASE_TAG=${NEODESK_CLIENT_RELEASE_TAG:-}
      - NEODESK_GITHUB_TOKEN=${NEODESK_GITHUB_TOKEN:-}
      - NEODESK_CUSTOM_CLIENT_SIGNING_SEED=${NEODESK_CUSTOM_CLIENT_SIGNING_SEED:-}
      - AGENT_ARTIFACT_DIR=/app/data/agent-builds
      - AGENT_BUILD_WORKER=${AGENT_BUILD_WORKER:-on}
      - AGENT_BUILD_POLL_MS=${AGENT_BUILD_POLL_MS:-5000}
      - AGENT_BUILD_COOLDOWN_MS=${AGENT_BUILD_COOLDOWN_MS:-1000}
      - DB_PATH=${NEODESK_DATA_PATH:-/opt/neodesk/data}/db_v2.sqlite3
      # Optional public client endpoints (IaC). Non-empty values override
      # /app/data/public-endpoints.env from Settings UI. Leave unset to use the panel.
      # Do not set empty PUBLIC_*= keys.
      # - PUBLIC_SERVER_ID=gateway.example.net
      # - PUBLIC_RELAY_SERVER=gateway.example.net
      # - PUBLIC_API_URL=https://api.example.net:21121
      - PUB_KEY_PATH=${NEODESK_DATA_PATH:-/opt/neodesk/data}/id_ed25519.pub
      - API_KEY_PATH=${NEODESK_DATA_PATH:-/opt/neodesk/data}/.api_key
      - SESSION_SECRET=${SESSION_SECRET:-}
      # Panel session policy (empty = built-in defaults)
      - SESSION_IDLE_TIMEOUT=${SESSION_IDLE_TIMEOUT:-}
      - SESSION_MAX_AGE=${SESSION_MAX_AGE:-}
      - SESSION_IDLE_WARN_MS=${SESSION_IDLE_WARN_MS:-}
      - SESSION_MAX_PER_USER=${SESSION_MAX_PER_USER:-}
      - DOCKER=true
      # Optional: map neodesk to host bind-mount owner (Synology etc.). Default 10001.
      - PUID=${PUID:-10001}
      - PGID=${PGID:-10001}
      - NEODESK_UPDATE_MODE=image
      - NEODESK_DOCKER_LAYOUT=single
      - NEODESK_IMAGE_TAG=${NEODESK_IMAGE_TAG:-latest}
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_URL=${DATABASE_URL:-}
      # The address clients reach this server at: the host's public IP or
      # DNS name, or its LAN address for a LAN-only server. Found at every
      # start when empty.
      - RELAY_SERVERS=${RELAY_SERVERS:-}
      - SIGNAL_RATE_LIMIT_PER_IP=${SIGNAL_RATE_LIMIT_PER_IP:-20}
      - ALLOW_LEGACY_OUTBOUND=${ALLOW_LEGACY_OUTBOUND:-N}
      # Enrollment mode of the first start ("open", "managed" or "locked").
      # Fresh volumes default to "managed"; a mode saved in the console stays
      # across restarts. ENROLLMENT_MODE_ENV_OVERRIDE=Y forces this value at
      # every start instead.
      - ENROLLMENT_MODE=${ENROLLMENT_MODE:-}
      - ENROLLMENT_MODE_ENV_OVERRIDE=${ENROLLMENT_MODE_ENV_OVERRIDE:-}
      - NTP_SERVERS=${NTP_SERVERS:-pool.ntp.org,time.google.com,time.cloudflare.com}
      - BILLING_MAX_CLOCK_SKEW_MS=${BILLING_MAX_CLOCK_SKEW_MS:-2000}
      - BILLING_REQUIRE_SYNCED_CLOCK=${BILLING_REQUIRE_SYNCED_CLOCK:-1}
      - BILLING_TRUST_OS_NTP=${BILLING_TRUST_OS_NTP:-Y}
      - AUTH_DB_PATH=/app/data/auth.db
      # The admin account of the first start. Without ADMIN_PASSWORD the
      # container makes a random password; neodesk-show-admin-credentials
      # prints it. An account that exists keeps its password.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - INIT_ADMIN_USER=${ADMIN_USERNAME:-admin}
      - INIT_ADMIN_PASS=${ADMIN_PASSWORD:-}
      - DEFAULT_ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - DEFAULT_ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - TZ=${TZ:-UTC}
    networks:
      - neodesk-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # SETUID and SETGID: the entrypoint starts the server as neodesk;
    # CHOWN and FOWNER: it gives the volumes to neodesk; KILL: tini, as
    # root, passes docker stop's SIGTERM on to the server running as
    # neodesk, which then shuts down cleanly
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - FOWNER
      - KILL
    # Checked every 10 seconds, so the container shows healthy soon after
    # the server is ready; unhealthy after a minute without an answer
    healthcheck:
      test: ["CMD", "/usr/local/bin/neodesk-healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 45s

  # guacd for RDP and VNC targets in the browser (the profile "guacd": put
  # COMPOSE_PROFILES=guacd into .env, or postgres,guacd with PostgreSQL). It
  # shares the neodesk container's network, because the server talks to
  # guacd only on loopback (GUACD_ADDRESS, 127.0.0.1:4822). When the neodesk
  # container restarts (Restart services, an update, docker restart) it
  # gets a new network and guacd would stay in the old one, where the
  # server can't reach it: guacd then ends and Docker starts it again in
  # the new one.
  guacd:
    image: guacamole/guacd:1.5.5
    container_name: neodesk-guacd
    profiles:
      - guacd
    network_mode: "service:neodesk"
    command:
      - /bin/sh
      - -c
      - |
        /opt/guacamole/sbin/guacd -b 127.0.0.1 -L "$${GUACD_LOG_LEVEL:-info}" -f &
        while sleep 5; do
          kill -0 $$! 2>/dev/null || exit 1
          ls /sys/class/net | grep -qvx lo || exit 1
        done
    depends_on:
      - neodesk
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # PostgreSQL instead of SQLite (the profile "postgres"; neodesk-docker.sh
  # sets it up). By hand, in .env next to this file:
  #   COMPOSE_PROFILES=postgres
  #   POSTGRES_PASSWORD=<a long random password>
  #   DATABASE_URL=postgres://neodesk:<the same password>@postgres:5432/neodesk?sslmode=disable
  # A volume with SQLite data is not moved by that: neodesk-docker.sh
  # postgres moves it.
  postgres:
    image: postgres:16-alpine
    container_name: neodesk-postgres
    profiles:
      - postgres
    environment:
      - POSTGRES_USER=neodesk
      # Compose reads this also while the profile is off; PostgreSQL itself
      # refuses to start with an empty one.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - POSTGRES_DB=neodesk
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - neodesk-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neodesk -d neodesk"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Traefik in front of the console with a Let's Encrypt certificate (the
  # profile "traefik", see the top of this file). It routes NEODESK_DOMAIN
  # to the console and redirects HTTP to HTTPS; the certificate is kept in
  # the volume neodesk-traefik-letsencrypt and renewed before it expires.
  # The routing comes from traefik-dynamic below, so Traefik needs no
  # Docker socket.
  traefik:
    image: traefik:${TRAEFIK_IMAGE_TAG:-v3.3}
    container_name: neodesk-traefik
    profiles:
      - traefik
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=INFO
      - --log.nocolor=true
      - --ping=true
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.caserver=${LETSENCRYPT_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    # The domain is part of the service's settings, so Compose makes the
    # container again when it changes and Traefik reads the new routing
    labels:
      - sk.neode.traefik.domain=${NEODESK_DOMAIN:-console.invalid}
    configs:
      - source: traefik-dynamic
        target: /etc/traefik/dynamic.yml
    volumes:
      - traefik-letsencrypt:/letsencrypt
    networks:
      - neodesk-net
    depends_on:
      - neodesk
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

configs:
  # Traefik's routing: NEODESK_DOMAIN to the console over the Compose
  # network, TLS 1.2 or newer, HSTS
  traefik-dynamic:
    content: |
      http:
        routers:
          neodesk-console:
            rule: "Host(`${NEODESK_DOMAIN:-console.invalid}`)"
            entryPoints:
              - websecure
            service: neodesk-console
            middlewares:
              - neodesk-hsts
            tls:
              certResolver: letsencrypt
        middlewares:
          neodesk-hsts:
            headers:
              stsSeconds: 31536000
        services:
          neodesk-console:
            loadBalancer:
              servers:
                - url: "http://neodesk:3375"
      tls:
        options:
          default:
            minVersion: VersionTLS12

networks:
  neodesk-net:
    driver: bridge
    enable_ipv6: ${NEODESK_IPV6:-false}

volumes:
  neodesk-data:
    name: neodesk-data
  console-data:
    name: neodesk-console-data
  postgres-data:
    name: neodesk-postgres-data
  traefik-letsencrypt:
    name: neodesk-traefik-letsencrypt
