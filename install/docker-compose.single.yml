# =============================================================================
# NeoDesk with Docker, built from this checkout (for development)
# =============================================================================
# This file builds the image neodesk:local from the repository and runs
# it: one container, one process (signal, relay, API and the web console).
# `docker compose pull` does not update it; rebuild after git pull:
#   git pull && NEODESK_COMMIT_SHA=$(git rev-parse HEAD) docker compose -f install/docker-compose.single.yml up -d --build
#
# Which compose file is which:
#   docker-compose.quick.single.yml          the published image, builds
#                                            nothing: start from this one
#   docker-compose.quick.single.macvlan.yml  the published image on a macvlan
#                                            network, with its own LAN address
#   docker-compose.single.yml                this file
#
# Quick start (SQLite, the default):
#   docker compose -f install/docker-compose.single.yml up -d --build
#
# With PostgreSQL:
#   PG_PASSWORD=YourStrongPasswordHere #   DB_TYPE=postgres DATABASE_URL=postgres://neodesk:YourStrongPasswordHere@postgres:5432/neodesk #     docker compose -f install/docker-compose.single.yml --profile postgres up -d --build
#
#   Or create a .env file next to this file (install/.env):
#     DB_TYPE=postgres
#     DATABASE_URL=postgres://neodesk:YourStrongPasswordHere@postgres:5432/neodesk
#     PG_PASSWORD=YourStrongPasswordHere
#   Then: docker compose -f install/docker-compose.single.yml --profile postgres up -d --build
#
# Access:
#   Web Console: http://localhost:3375
#   Client API:  http://localhost:21121  (not the console, :3375)
#   Admin password: docker compose -f install/docker-compose.single.yml exec neodesk neodesk-show-admin-credentials
#   (random unless ADMIN_PASSWORD is set before the first start)
# =============================================================================

services:
  # NeoDesk: signal, relay, API and web console in one process
  neodesk:
    build:
      # The repository's root; the Dockerfiles are in docker/
      context: ..
      dockerfile: docker/Dockerfile
      # The commit the binary reports (-version, the update check):
      #   NEODESK_COMMIT_SHA=$(git rev-parse HEAD) docker compose -f install/docker-compose.single.yml up -d --build
      args:
        NEODESK_COMMIT_SHA: ${NEODESK_COMMIT_SHA:-}
    image: neodesk:local
    pull_policy: never
    container_name: neodesk
    hostname: neodesk
    ports:
      # On every address of the host, IPv4 and IPv6; NEODESK_CONSOLE_BIND
      # names one (127.0.0.1 behind a reverse proxy, [::1] for IPv6)
      - "${NEODESK_CONSOLE_BIND:+${NEODESK_CONSOLE_BIND}:}${NEODESK_CONSOLE_PORT:-3375}:3375"  # Web console
      - "${NEODESK_CONSOLE_BIND:+${NEODESK_CONSOLE_BIND}:}${NEODESK_CONSOLE_HTTPS_PORT:-5443}:5443"  # Web console with HTTPS_ENABLED=true
      - "21114:21114"           # API for RustDesk clients without an API server setting
      - "21115:21115"           # NAT type test
      - "21116:21116/tcp"       # Signal TCP
      - "21116:21116/udp"       # Signal UDP
      - "21117:21117"           # Relay TCP
      - "21118:21118"           # WebSocket Signal
      - "21119:21119"           # WebSocket Relay
      - "21123:21123"           # Relay node control
      - "21121:21121"           # HTTP API (RustDesk client + REST, WAN-facing)
      - "21122:21122"           # CDAP gateway (custom devices and agents)
    volumes:
      - neodesk-data:/opt/neodesk/data
      - console-data:/app/data
    # Every KEY=value of .env next to this file reaches the server; the
    # entries under environment below win over it.
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      # Set TRUST_PROXY=1 when the panel is behind one reverse proxy.
      - TRUST_PROXY=${TRUST_PROXY:-}
      - CONSOLE_PORT=3375
      - HOST=0.0.0.0
      - API_HOST=0.0.0.0
      - API_ENABLED=false
      - ENCRYPTED_ONLY=1
      - SERVER_BACKEND=neodesk
      - HBBS_API_URL=http://127.0.0.1:21121/api
      - NEODESK_API_URL=http://127.0.0.1:21121/api
      - RUSTDESK_PATH=/opt/neodesk/data
      - DATA_DIR=/app/data
      - NEODESK_CLIENT_REPO=${NEODESK_CLIENT_REPO:-neodeskapp/neodesk-client}
      - NEODESK_CLIENT_RELEASE_TAG=${NEODESK_CLIENT_RELEASE_TAG:-}
      - NEODESK_GITHUB_TOKEN=${NEODESK_GITHUB_TOKEN:-}
      - NEODESK_CUSTOM_CLIENT_SIGNING_SEED=${NEODESK_CUSTOM_CLIENT_SIGNING_SEED:-}
      - AGENT_ARTIFACT_DIR=/app/data/agent-builds
      - AGENT_BUILD_WORKER=${AGENT_BUILD_WORKER:-on}
      - AGENT_BUILD_POLL_MS=${AGENT_BUILD_POLL_MS:-5000}
      - AGENT_BUILD_COOLDOWN_MS=${AGENT_BUILD_COOLDOWN_MS:-1000}
      - DB_PATH=/opt/neodesk/data/db_v2.sqlite3
      - PUB_KEY_PATH=/opt/neodesk/data/id_ed25519.pub
      - API_KEY_PATH=/opt/neodesk/data/.api_key
      - SESSION_SECRET=${SESSION_SECRET:-}
      # Panel session policy (empty = built-in defaults)
      - SESSION_IDLE_TIMEOUT=${SESSION_IDLE_TIMEOUT:-}
      - SESSION_MAX_AGE=${SESSION_MAX_AGE:-}
      - SESSION_IDLE_WARN_MS=${SESSION_IDLE_WARN_MS:-}
      - SESSION_MAX_PER_USER=${SESSION_MAX_PER_USER:-}
      - DOCKER=true
      # Optional: map neodesk to host bind-mount owner (Synology etc.). Default 10001.
      - PUID=${PUID:-10001}
      - PGID=${PGID:-10001}
      # Database — defaults to SQLite; set via .env or command line for PostgreSQL
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_URL=${DATABASE_URL:-}
      # Relay server address (public IP or domain).
      # Auto-detected if not set. MUST be set if auto-detection returns
      # Docker internal IP (172.x.x.x) — remote relay connections will fail otherwise.
      - RELAY_SERVERS=${RELAY_SERVERS:-}
      # Raise this for very large NAT/proxy deployments; 0 disables signal rate limiting.
      - SIGNAL_RATE_LIMIT_PER_IP=${SIGNAL_RATE_LIMIT_PER_IP:-20}
      - ALLOW_LEGACY_OUTBOUND=${ALLOW_LEGACY_OUTBOUND:-N}
      # Enrollment mode of the first start ("open", "managed" or "locked").
      # Fresh volumes default to "managed"; a mode saved in the console stays
      # across restarts. ENROLLMENT_MODE_ENV_OVERRIDE=Y forces this value at
      # every start instead.
      - ENROLLMENT_MODE=${ENROLLMENT_MODE:-}
      - ENROLLMENT_MODE_ENV_OVERRIDE=${ENROLLMENT_MODE_ENV_OVERRIDE:-}
      - NTP_SERVERS=${NTP_SERVERS:-pool.ntp.org,time.google.com,time.cloudflare.com}
      - BILLING_MAX_CLOCK_SKEW_MS=${BILLING_MAX_CLOCK_SKEW_MS:-2000}
      - BILLING_REQUIRE_SYNCED_CLOCK=${BILLING_REQUIRE_SYNCED_CLOCK:-1}
      - BILLING_TRUST_OS_NTP=${BILLING_TRUST_OS_NTP:-Y}
      # Panel folders/groups for RustDesk client (SQLite — same container as console).
      - AUTH_DB_PATH=/app/data/auth.db
      # Admin credentials (first run only; existing users are not overwritten).
      # Do NOT comment these out — ADMIN_PASSWORD on the host shell only reaches
      # the container when referenced here.
      #   ADMIN_PASSWORD=YourSecurePassword123 docker compose -f install/docker-compose.single.yml up -d --build
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - INIT_ADMIN_USER=${ADMIN_USERNAME:-admin}
      - INIT_ADMIN_PASS=${ADMIN_PASSWORD:-}
      - DEFAULT_ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - DEFAULT_ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # SETUID and SETGID: the entrypoint starts the server as neodesk;
    # CHOWN and FOWNER: it gives the volumes to neodesk; KILL: tini, as
    # root, passes docker stop's SIGTERM on to the server running as
    # neodesk, which then shuts down cleanly
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - FOWNER
      - KILL
    # Checked every 10 seconds, so the container shows healthy soon after
    # the server is ready; unhealthy after a minute without an answer
    healthcheck:
      test: ["CMD", "/usr/local/bin/neodesk-healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 45s

  # PostgreSQL (optional — use with --profile postgres)
  postgres:
    image: postgres:16-alpine
    container_name: neodesk-postgres
    environment:
      - POSTGRES_USER=neodesk
      # Compose interpolates profile variables even when the profile is disabled.
      # Keep SQLite/default validation usable without a secret; the postgres
      # profile still requires PG_PASSWORD to be set before it is started.
      - POSTGRES_PASSWORD=${PG_PASSWORD:-}
      - POSTGRES_DB=neodesk
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    # L-02: drop caps for PostgreSQL; gosu needs SETUID/SETGID to drop root.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - FOWNER
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neodesk"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - postgres

  # Nginx Reverse Proxy (optional — use with --profile nginx)
  nginx:
    image: nginx:alpine
    container_name: neodesk-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    depends_on:
      - neodesk
    profiles:
      - nginx

volumes:
  neodesk-data:
  console-data:
  postgres-data:

# NEODESK_IPV6=true (Docker Engine 27 or newer): the network has IPv6, so
# the server sees IPv6 visitors' own addresses instead of the gateway
networks:
  default:
    name: neodesk-net
    enable_ipv6: ${NEODESK_IPV6:-false}
